# Weekly self-improvement job: analyzes the maintainer's manual edits to the
# digest PRs merged in the past week and, when a clear recurring pattern
# warrants it, opens a DRAFT pull request proposing a minimal, guardrail-
# preserving change to the generation prompts (scripts/prompts.js). It never
# writes to main and never merges — a human reviews and merges every proposal.
#
# This workflow must NEVER gain a push/pull_request trigger: it analyzes merged
# PRs and opens PRs, so a push/PR trigger could create a feedback loop.
name: 'Propose Prompt Improvements'

on:
  # Manual trigger with optional window overrides for re-runs / backfills:
  workflow_dispatch:
    inputs:
      since:
        description: 'Window start (YYYY-MM-DD, UTC). Defaults to until minus 7 days.'
        required: false
        type: string
      until:
        description: 'Window end (YYYY-MM-DD, UTC, exclusive). Defaults to today.'
        required: false
        type: string

  # Weekly, Mondays at 06:00 UTC:
  schedule:
    - cron: '0 6 * * 1'

# Least privilege: only what is needed to push a branch and open a draft PR.
permissions:
  contents: write
  pull-requests: write

# Never let two runs overlap; the later one waits rather than cancelling.
concurrency:
  group: 'prompt-improvements'
  cancel-in-progress: false

jobs:
  propose:
    name: 'Analyze maintainer edits and open a draft PR'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      # Full history so the bot-draft and human-edit commits are reachable for git diff:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Install Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
        timeout-minutes: 5

      - name: 'Install dependencies'
        run: 'npm ci'
        timeout-minutes: 5

      # Fail loudly if the guardrail phrase list has drifted from the prompts:
      - name: 'Assert guardrails present'
        run: 'node scripts/guardrails.js'

      # The one script step. Secrets are passed ONLY as env, never echoed.
      # GH_TOKEN authenticates the gh CLI; GITHUB_TOKEN is used by git push.
      - name: 'Propose prompt improvements'
        run: 'node scripts/propose_prompt_improvements.js'
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT_REVIEW_SINCE: ${{ github.event.inputs.since }}
          PROMPT_REVIEW_UNTIL: ${{ github.event.inputs.until }}
        timeout-minutes: 15
